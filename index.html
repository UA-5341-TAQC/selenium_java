<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Allure DevOps Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      padding: 40px;
      color: #2c3e50;
    }
    h1 { color: #2c3e50; }
    .card {
      background: white;
      padding: 20px;
      margin-bottom: 15px;
      border-radius: 12px;
      box-shadow: 0 4px 12px rgba(0,0,0,.1);
      border-left: 6px solid #3498db;
      overflow-wrap: anywhere;
    }
    .main { border-left-color: #2ecc71; }
    .failed { border-left-color: #e74c3c; }
    .stats {
      margin-top: 10px;
      font-size: 14px;
      line-height: 1.8;
    }
    .date { color: #777; }
    .banner {
      padding: 15px;
      margin-bottom: 25px;
      border-radius: 8px;
      font-weight: bold;
    }
    .ok { background: #d4edda; color: #155724; }
    .bad { background: #f8d7da; color: #721c24; }
    a {
      text-decoration: none;
      font-weight: bold;
      font-size: 18px;
    }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
<h1>Allure DevOps Dashboard</h1>
<p class="date">Last updated: 2026-10-30 12:01:10 UTC</p>
<div class="card failed">
  <a href="./main/">main Report</a>
  <div class="stats">
    Total: 39 |
    Passed: 23 |
    Failed: 2 |
    Broken: 0 |
    Skipped: 0 |
    Failure rate: 5%
  </div>
</div>
<div class="card failed">
  <a href="./pr-1034/">pr-1034 Report</a>
  <div class="stats">
    Total: 54 |
    Passed: 38 |
    Failed: 2 |
    Broken: 0 |
    Skipped: 0 |
    Failure rate: 3%
  </div>
</div>
<div class='banner bad'>Some reports contain failed or broken tests.</div>
</body></html>
